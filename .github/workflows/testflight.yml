name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "Makefile"
      - ".swiftlint.yml"
      - ".swiftformat"
      - "tools/**"
      - "docs/design/tokens/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT_PATH: apps/ios/RuteinApp/RuteinApp.xcodeproj
      SCHEME: RuteinApp
      BUNDLE_ID: com.ayungavis.RuteinApp
      TEAM_ID: QHL64K2LPL
      PROVISIONING_PROFILE_NAME: RuteinApp Apple Distribution
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - run: brew install xcodegen

      - run: make ios-generate

      - name: Validate App Store Connect credentials
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          [ -n "$APPSTORE_ISSUER_ID" ] || { echo "Missing GitHub variable APPSTORE_ISSUER_ID"; exit 1; }
          [ -n "$APPSTORE_API_KEY_ID" ] || { echo "Missing GitHub variable APPSTORE_API_KEY_ID"; exit 1; }
          [ -n "$APPSTORE_API_PRIVATE_KEY" ] || { echo "Missing GitHub secret APPSTORE_API_PRIVATE_KEY"; exit 1; }

      - name: Import code signing certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download provisioning profiles
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          profile-type: IOS_APP_STORE
          bundle-id: ${{ env.BUNDLE_ID }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Create export options plist
        run: |
          mkdir -p .build
          cat > .build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          perl -0pi -e 's/\$\{TEAM_ID\}/$ENV{TEAM_ID}/g; s/\$\{BUNDLE_ID\}/$ENV{BUNDLE_ID}/g; s/\$\{PROVISIONING_PROFILE_NAME\}/$ENV{PROVISIONING_PROFILE_NAME}/g' .build/ExportOptions.plist

      - name: Archive app
        run: >
          xcodebuild
          -project "$PROJECT_PATH"
          -scheme "$SCHEME"
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath .build/Archives/RuteinApp.xcarchive
          -derivedDataPath .build/DerivedData
          -resultBundlePath .build/RuteinAppArchive.xcresult
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          archive

      - name: Export IPA
        run: >
          xcodebuild
          -exportArchive
          -archivePath .build/Archives/RuteinApp.xcarchive
          -exportPath .build/export
          -exportOptionsPlist .build/ExportOptions.plist

      - name: Upload TestFlight build
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: .build/export/RuteinApp.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Upload result bundles on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: .build/**/*.xcresult
