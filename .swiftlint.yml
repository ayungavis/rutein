included:
  - apps

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "**/*.xcodeproj"
  - .agents
  - .claude
  - .codegraph

opt_in_rules:
  - force_unwrapping
  - file_name
  - explicit_init
  - empty_count
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - closure_spacing
  - redundant_nil_coalescing
  - joined_default_parameter
  - literal_expression_end_indentation
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

trailing_comma:
  mandatory_comma: true

force_cast:
  severity: error
force_try:
  severity: error
force_unwrapping:
  severity: error

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - to
    - at

custom_rules:
  unauthorized_comment:
    name: "Unauthorized comment"
    regex: '(?://(?!\s*(?:swiftlint:|MARK:|tradeoff:|unsafe:|swift-tools-version:))|/\*)'
    message: "Comments are banned. Allowed: // swiftlint:, // MARK:, // tradeoff:, // unsafe: <reason>. Explain in the reply, or rename or extract the code."
    severity: error
    match_kinds:
      - comment
      - doccomment

  localized_text_needs_bundle:
    name: "Localized Text needs a bundle"
    regex: 'Text\("[^"]*"\)'
    message: "Text inside the package must resolve bundle: .module, or use Text(verbatim:) when the string is not translatable."
    severity: error

  no_any_view:
    name: "No AnyView"
    regex: '\bAnyView\b'
    message: "AnyView is banned (PRD section 9). Use generics or @ViewBuilder."
    severity: error
    match_kinds:
      - identifier
      - typeidentifier

  no_untyped_dictionary:
    name: "No untyped dictionary in Domain APIs"
    regex: '\[\s*String\s*:\s*Any\s*\]'
    message: "Untyped dictionaries are banned in Domain APIs (PRD section 9). Decode into a typed DTO."
    severity: error

  literal_design_token:
    name: "Literal design token"
    regex: '\.(?:padding|cornerRadius|shadow)\(\s*-?\d|\.(?:padding|spacing)\(\s*(?:\.\w+\s*,\s*)?-?\d+\s*\)|(?:cornerRadius|radius):\s*-?\d|spacing:\s*-?[1-9]|\bColor\.(?:red|blue|green|black|white|gray|orange|yellow|pink|purple)\b|\.font\(\s*\.system\('
    message: "Colours, fonts, spacing, corner radii and shadows come from AppColor, AppFont, Spacing, Radius and .appShadow(). A literal here drifts from the design tokens."
    severity: error
    excluded: ".*/DesignSystem/.*"

  no_parallel_logging:
    name: "No parallel logging API"
    regex: '\bos_log\b|\bOSLog\(|\bLogger\(|\bprint\(|\bdebugPrint\(|\bNSLog\('
    message: "Logging goes through Log (PRD section 12): do not create a parallel logging API, and never print. Log takes a LogStage, a count and an AppError, so route names and coordinates cannot reach a log through it."
    severity: error
    excluded: ".*/Core/Log\\.swift"

reporter: "xcode"
